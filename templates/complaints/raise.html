{% extends "base.html" %}
{% block title %}Raise Complaint — SmartHostel{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Raise Maintenance Complaint</h1>
  <p class="page-subtitle">Report a facility or maintenance issue in your hostel or room</p>
</div>

<div class="card-section max-width-card">
  <form method="POST" action="{{ url_for('complaint.raise_complaint') }}">
    <label class="field">
      <span>Complaint Category *</span>
      <select name="category" class="input-select" required>
        <option value="">Select Category</option>
        {% for cat in categories %}
        <option value="{{ cat }}">{{ cat }}</option>
        {% endfor %}
      </select>
    </label>

    <label class="field">
      <span>Complaint Title *</span>
      <input type="text" name="title" placeholder="e.g. Bathroom tap leaking / Fan not working" required>
    </label>

    <label class="field">
      <span>Detailed Description *</span>
      <textarea name="description" rows="4" placeholder="Describe the issue in detail, including specific location or room item." required></textarea>
    </label>

    <div class="form-actions">
      <a href="{{ url_for('complaint.index') }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Submit Complaint <i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </form>
</div>
{% endblock %}
