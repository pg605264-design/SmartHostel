{% extends "base.html" %}
{% block title %}Edit Profile — SmartHostel{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit Profile</h1>
  <p class="page-subtitle">Update your personal and academic information</p>
</div>

<div class="card-section max-width-card">
  <form method="POST" action="{{ url_for('profile.edit') }}">
    <div class="form-grid">
      <label class="field">
        <span>Full Name *</span>
        <input type="text" name="name" value="{{ form_data.name }}" required>
      </label>

      <label class="field">
        <span>Email Address *</span>
        <input type="email" name="email" value="{{ form_data.email }}" required>
      </label>
    </div>

    <div class="form-grid">
      <label class="field">
        <span>Phone Number</span>
        <input type="tel" name="phone" value="{{ form_data.phone }}" placeholder="+91 9876543210">
      </label>

      {% if current_user.role == 'student' %}
      <label class="field">
        <span>Course / Department</span>
        <input type="text" name="course" value="{{ form_data.course }}" placeholder="Computer Science">
      </label>
      {% endif %}
    </div>

    {% if current_user.role == 'student' %}
    <div class="form-grid">
      <label class="field">
        <span>Year of Study</span>
        <select name="year" class="input-select">
          <option value="">Select Year</option>
          <option value="1" {% if form_data.year == '1' or form_data.year == 1 %}selected{% endif %}>1st Year</option>
          <option value="2" {% if form_data.year == '2' or form_data.year == 2 %}selected{% endif %}>2nd Year</option>
          <option value="3" {% if form_data.year == '3' or form_data.year == 3 %}selected{% endif %}>3rd Year</option>
          <option value="4" {% if form_data.year == '4' or form_data.year == 4 %}selected{% endif %}>4th Year</option>
        </select>
      </label>
    </div>
    {% endif %}

    <div class="form-actions">
      <a href="{{ url_for('profile.index') }}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Changes <i class="fa-solid fa-check"></i></button>
    </div>
  </form>
</div>
{% endblock %}
